# TrustLine Soroban contract workspace.
# Members are stubs in Phase 0 (scaffolding only); logic lands in Phase 1.
[workspace]
resolver = "2"
members = [
    "score_registry",
    "credit_line",
    "lending_vault",
    "libraries/revenue_math",
    "adapters/stellar8004_identity",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Single source of truth for the SDK version across every crate.
# Pinned to "26" — the version `stellar contract init` scaffolds for stellar-cli
# 27.0.0 (verified Phase 1).
[workspace.dependencies]
soroban-sdk = "26"
revenue_math = { path = "libraries/revenue_math" }

# Release profile per the soroban skill: small, overflow-checked WASM.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
