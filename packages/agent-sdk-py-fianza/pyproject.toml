[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fianza-agent-sdk"
version = "0.1.0"
description = "Python SDK for AI agents to take and repay revenue-underwritten credit on Fianza (Stellar). Settles in USDC."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["stellar", "soroban", "x402", "ai-agents", "credit", "usdc", "defi"]
authors = [{ name = "Fianza" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "stellar-sdk>=13,<16",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://0xtrustline.online"
Repository = "https://github.com/TechnicallyKiller/TrustLine"
Issues = "https://github.com/TechnicallyKiller/TrustLine/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fianza"]

[tool.pytest.ini_options]
testpaths = ["tests"]
